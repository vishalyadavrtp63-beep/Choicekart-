<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>College Details | ChoiceKart</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f8fc;
color:#172033;
}

header{
background:#102d4f;
color:white;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:800;
}

.logo span{
color:#ff841f;
}

header a{
color:white;
text-decoration:none;
}

.container{
max-width:1000px;
margin:auto;
padding:40px 18px;
}

.back{
display:inline-block;
margin-bottom:20px;
color:#102d4f;
font-weight:bold;
}

.hero{
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 5px 20px #00000010;
}

.badge{
display:inline-block;
background:#edf4ff;
color:#102d4f;
padding:6px 11px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

h1{
color:#102d4f;
font-size:34px;
}

.location{
color:#64748b;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:25px;
}

.box{
background:#f8fafc;
padding:16px;
border-radius:10px;
}

.box small{
color:#64748b;
}

.box strong{
display:block;
margin-top:6px;
}

.section{
background:white;
padding:25px;
border-radius:15px;
margin-top:20px;
box-shadow:0 5px 20px #0000000a;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.tag{
background:#edf4ff;
padding:8px 12px;
border-radius:7px;
font-size:13px;
}

.website{
display:inline-block;
background:#102d4f;
color:white;
padding:12px 18px;
border-radius:8px;
text-decoration:none;
margin-top:15px;
}

.error{
background:white;
padding:50px;
text-align:center;
border-radius:15px;
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

h1{
font-size:27px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
Choice<span>Kart</span>
</div>

<a href="college-directory.html">
← Colleges
</a>

</header>


<div class="container">

<a
class="back"
href="college-directory.html"
>
← Back to College Directory
</a>


<div id="content">

Loading...

</div>


</div>


<script>


const params=
new URLSearchParams(
window.location.search
);


const id=
params.get("id");


function escapeHTML(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char];

});

}



async function loadCollege(){

try{

const response=
await fetch(
"colleges.json"
);


const colleges=
await response.json();


const college=
colleges.find(
c=>c.id===id
);


if(!college){

document.getElementById(
"content"
).innerHTML=`

<div class="error">

<h2>College not found</h2>

<p>
The requested college
does not exist in our database.
</p>

</div>

`;

return;

}


document.title=
college.name+
" | ChoiceKart";


document.getElementById(
"content"
).innerHTML=`

<section class="hero">

<span class="badge">

${escapeHTML(
college.type
)}

</span>


<h1>

${escapeHTML(
college.name
)}

</h1>


<p class="location">

📍

${escapeHTML(
college.city
)}

,

${escapeHTML(
college.state
)}

</p>


<div class="grid">


<div class="box">

<small>
Category
</small>

<strong>
${escapeHTML(
college.category
)}
</strong>

</div>


<div class="box">

<small>
Established
</small>

<strong>
${escapeHTML(
college.established ||
"Not available"
)}
</strong>

</div>


<div class="box">

<small>
Affiliation
</small>

<strong>
${escapeHTML(
college.affiliation ||
"Not available"
)}
</strong>

</div>


<div class="box">

<small>
NIRF Rank
</small>

<strong>
${
college.nirfRank
?
escapeHTML(
college.nirfRank
)
:
"Not available"
}
</strong>

</div>


<div class="box">

<small>
Fees
</small>

<strong>
${
college.fees
?
escapeHTML(
college.fees
)
:
"Not available"
}
</strong>

</div>


<div class="box">

<small>
Placement
</small>

<strong>
${
college.placement
?
escapeHTML(
college.placement
)
:
"Not available"
}
</strong>

</div>

</div>


${
college.website
?

`<a
class="website"
href="${escapeHTML(college.website)}"
target="_blank"
rel="noopener"
>
Visit Official Website →
</a>`

:

""

}

</section>


<section class="section">

<h2>
About
</h2>

<p>

${escapeHTML(
college.description ||
"No description available."
)}

</p>

</section>


<section class="section">

<h2>
Approvals
</h2>

<div class="tags">

${
(college.approvals || [])
.map(
item=>
`<span class="tag">
${escapeHTML(item)}
</span>`
)
.join("")
}

</div>

</section>


<section class="section">

<h2>
Courses
</h2>

<div class="tags">

${
(college.courses || [])
.map(
item=>
`<span class="tag">
${escapeHTML(item)}
</span>`
)
.join("")
}

</div>

</section>


<section class="section">

<h2>
Address
</h2>

<p>

${escapeHTML(
college.address ||
"Address not available"
)}

</p>

</section>

`;

}

catch(error){

document.getElementById(
"content"
).innerHTML=`

<div class="error">

<h2>
Unable to load college
</h2>

<p>
Please try again later.
</p>

</div>

`;

console.error(error);

}

}


loadCollege();

</script>


</body>

</html>
