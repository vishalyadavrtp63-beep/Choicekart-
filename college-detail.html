<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="College details, courses, approvals, affiliation and official website information on ChoiceKart.">
<meta name="robots" content="index,follow">
<title>College Details | ChoiceKart</title>
<style>
:root{--navy:#102d4f;--orange:#ff841f;--bg:#f5f8fc;--text:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none}header{background:var(--navy);color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:800}.logo span{color:var(--orange)}header a{color:#fff;font-weight:bold}.container{max-width:1000px;margin:auto;padding:40px 18px}.back{display:inline-block;margin-bottom:20px;color:var(--navy);font-weight:bold}.hero,.section,.error{background:#fff;padding:28px;border-radius:16px;box-shadow:0 5px 20px #00000010}.badge,.tag{display:inline-block;background:#edf4ff;color:var(--navy);padding:6px 11px;border-radius:20px;font-size:12px;font-weight:bold}.hero h1{color:var(--navy);font-size:34px;line-height:1.2;margin:14px 0}.location{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}.box{background:#f8fafc;padding:16px;border-radius:10px}.box small{color:var(--muted)}.box strong{display:block;margin-top:6px}.section{margin-top:20px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tag{border-radius:7px}.website{display:inline-block;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;margin-top:15px;font-weight:bold}.error{text-align:center;padding:50px}.error h2{color:var(--navy)}a:focus,button:focus{outline:3px solid #93c5fd;outline-offset:2px}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style>
</head>
<body>
<header><div class="logo">Choice<span>Kart</span></div><a href="college-directory.html">← Colleges</a></header>
<main class="container"><a class="back" href="college-directory.html">← Back to College Directory</a><div id="content" aria-live="polite">Loading college…</div></main>
<script>
'use strict';
const params=new URLSearchParams(location.search);const id=params.get('id');const stateParam=params.get('state');
const $=id=>document.getElementById(id);const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(value){try{const u=new URL(String(value));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
async function loadCollege(){
 try{
  if(!id||!stateParam)throw new Error('Missing college id/state');
  const response=await fetch('https://indian-colleges-list.vercel.app/api/institutions/states/'+encodeURIComponent(stateParam),{headers:{Accept:'application/json'}});
  if(!response.ok)throw new Error('College API failed');
  const result=await response.json();const rows=Array.isArray(result)?result:(result.data||result.institutions||[]);
  const college=rows.find(c=>String(c.id||c.aicte_id||c.aishe_code||'')===String(id));
  if(!college){$('content').innerHTML='<div class="error"><h2>College not found</h2><p>The requested college could not be found in the live database.</p></div>';return}
  const n={name:college.name||college.institute_name||college.college_name||'Unnamed Institution',city:college.city||college.town||'',state:college.state||college.state_name||stateParam,type:college.institution_type||college.type||'Affiliated College',category:college.category||'College / Institute',established:college.established||'',affiliation:college.university||college.university_name||college.affiliated_university||'',nirfRank:college.nirfRank||college.nirf_rank||null,fees:college.fees||college.fees_ug_inr||null,placement:college.placement||college.placement_avg_lpa||null,website:safeURL(college.website||college.institute_website||''),approvals:Array.isArray(college.approvals)?college.approvals:[],courses:Array.isArray(college.courses)?college.courses:(college.course?[college.course]:[]),address:college.address||college.institute_address||'',description:college.description||'College/institution information from the public AICTE dataset.'};
  document.title=n.name+' | ChoiceKart';
  $('content').innerHTML='<section class="hero"><span class="badge">'+escapeHTML(n.type)+'</span><h1>'+escapeHTML(n.name)+'</h1><p class="location">📍 '+escapeHTML(n.city)+(n.city&&n.state?', ':'')+escapeHTML(n.state)+'</p><div class="grid">'+[['Category',n.category],['Established',n.established||'Not available'],['Affiliation',n.affiliation||'Not available'],['NIRF Rank',n.nirfRank||'Not available'],['Fees',n.fees||'Not available'],['Placement',n.placement||'Not available']].map(x=>'<div class="box"><small>'+escapeHTML(x[0])+'</small><strong>'+escapeHTML(x[1])+'</strong></div>').join('')+'</div>'+(n.website?'<a class="website" href="'+escapeHTML(n.website)+'" target="_blank" rel="noopener noreferrer">Visit Official Website →</a>':'')+'</section><section class="section"><h2>About</h2><p>'+escapeHTML(n.description)+'</p></section><section class="section"><h2>Approvals</h2><div class="tags">'+(n.approvals.map(x=>'<span class="tag">'+escapeHTML(x)+'</span>').join('')||'<span class="tag">Public dataset information</span>')+'</div></section><section class="section"><h2>Courses</h2><div class="tags">'+(n.courses.map(x=>'<span class="tag">'+escapeHTML(x)+'</span>').join('')||'<span class="tag">Multiple courses</span>')+'</div></section><section class="section"><h2>Address</h2><p>'+escapeHTML(n.address||'Address not available')+'</p></section>';
 }catch(e){console.error(e);$('content').innerHTML='<div class="error"><h2>Unable to load college</h2><p>Please refresh and try again.</p></div>'}
}
loadCollege();
</script>
</body>
</html>
